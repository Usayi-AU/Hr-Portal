{% extends 'core/dashboard_base.html' %}

{% block dashboard_content %}
<div class="rounded-[30px] border border-slate-200 bg-gradient-to-br from-white to-slate-50 p-4 shadow-[0_24px_50px_rgba(15,23,42,0.06)] backdrop-blur-sm sm:p-6">
    <div class="mb-6 flex flex-wrap items-center justify-between gap-3 border-b border-slate-200/80 pb-5">
        <div>
            <div class="inline-flex items-center gap-2 rounded-full border border-teal-200 bg-teal-50 px-3 py-1 text-[10px] font-bold uppercase tracking-[0.22em] text-teal-700">
                <span class="h-2 w-2 rounded-full bg-teal-600"></span>
                Operations
            </div>
            <h2 class="mt-3 text-2xl font-bold tracking-tight text-slate-900">{{ page_title }}</h2>
            <p class="mt-1 text-xs text-slate-600">Manage your {{ page_title|lower }}</p>
        </div>
        {% if can_create %}
        <a href="{{ create_url }}" class="inline-flex items-center gap-2 rounded-xl btn-primary px-4 py-2.5 text-xs font-semibold text-white shadow-lg shadow-teal-900/10">
            <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/>
            </svg>
            Add New
        </a>
        {% endif %}
    </div>
    {% block module_content %}{% endblock %}
</div>
{% endblock %}
